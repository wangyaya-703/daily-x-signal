runtime:
  host_mode: standalone   # standalone 或 openclaw

x:
  viewer_handle: your_x_handle
  viewer_user_id: "your_x_user_id"
  expected_following_count: 800
  following_count_confirmed: true

profile:
  preferred_topics:
    - ai_coding
    - agent_frameworks
  interest_keywords:
    - codex
    - tool calling
    - benchmark

llm:
  enabled: true
  provider: openai_compatible
  api_style: responses
  model: glm-4.7
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  api_key: your-local-api-key
  api_key_env: DAILY_X_SIGNAL_API_KEY

outputs:
  feishu:
    enabled: true
    delivery_type: app
    top_n: 10
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    receive_id_env: DAILY_X_SIGNAL_FEISHU_RECEIVE_ID
    receive_id_type: email
  feishu_bitable:
    enabled: false
    app_token: your_bitable_app_token
    table_id: your_bitable_table_id

openclaw:
  enabled: false
  use_linked_feishu_bot: true
  use_heartbeat: true
  bot_app_id_env: OPENCLAW_FEISHU_APP_ID
  bot_app_secret_env: OPENCLAW_FEISHU_APP_SECRET
  bot_receive_id_env: OPENCLAW_FEISHU_RECEIVE_ID
  bot_receive_id_type: open_id
