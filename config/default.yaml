profile:
  timezone: Asia/Shanghai
  default_mode: all_following
  digest_top_n: 10
  review_pick_count: 1
  preferred_topics: []
  interest_keywords: []
  disliked_keywords: []

runtime:
  host_mode: standalone

scheduler:
  enabled: true
  trigger_hour: 8
  trigger_minute: 30
  catchup_deadline_hour: 11
  catchup_deadline_minute: 30
  poll_interval_minutes: 15

github_fallback:
  enabled: true
  owner: wangyaya-703
  repo: daily-x-signal
  success_date_variable: LAST_DAILY_X_SIGNAL_SUCCESS_DATE
  success_at_variable: LAST_DAILY_X_SIGNAL_SUCCESS_AT

openclaw:
  enabled: false
  use_linked_feishu_bot: true
  use_heartbeat: true
  bot_app_id_env: OPENCLAW_FEISHU_APP_ID
  bot_app_secret_env: OPENCLAW_FEISHU_APP_SECRET
  bot_receive_id_env: OPENCLAW_FEISHU_RECEIVE_ID
  bot_receive_id_type: open_id

x:
  viewer_handle: null
  viewer_user_id: null
  fallback_to_home_timeline: true
  following_sync_max_pages: 20
  max_authors_per_run: 0
  max_active_authors_per_run: 20
  tweets_pages_per_author: 1
  include_replies: true
  reply_like_threshold: 100
  thread_fetch_top_n: 12
  min_post_length: 20
  dedupe_by_conversation: true
  expected_following_count: null
  following_count_confirmed: false
  require_following_confirmation: true
  following_completion_ratio_warn_threshold: 0.85

topics:
  ai_coding:
    weight: 1.0
    keywords:
      - ai coding
      - claude code
      - openclaw
      - codex
      - cursor
      - windsurf
      - coding agent
      - code agent
      - software engineering
      - dev tool
      - mcp
      - skill
      - skills
  agent_frameworks:
    weight: 1.0
    keywords:
      - agent
      - multi agent
      - orchestration
      - workflow
      - framework
      - autogen
      - langgraph
      - crewai
      - smolagents
      - agno
      - tool calling
  model_releases:
    weight: 0.95
    keywords:
      - model
      - gpt
      - claude
      - gemini
      - qwen
      - kimi
      - deepseek
      - release
      - launch
      - benchmark
      - inference
  papers_algorithms:
    weight: 0.9
    keywords:
      - paper
      - arxiv
      - algorithm
      - research
      - transformer
      - reasoning
      - reinforcement learning
      - diffusion
      - llm
      - rlhf

ranking:
  weights:
    topic_relevance: 0.35
    substance: 0.35
    social_signal: 0.20
    author_signal: 0.10
  max_posts_per_author: 2
  penalties:
    too_short: 0.20
    pure_link: 0.10
    obvious_noise: 0.40

personalization:
  enabled: true
  ranking_weight: 0.15
  author_profile_sample_limit: 200
  interest_keyword_limit: 12

core_authors:
  enabled: true
  mode_default_limit: 30
  history_window_days: 14
  min_runs_before_activation: 3
  scoring:
    selected_runs: 0.40
    avg_priority: 0.30
    avg_topic_relevance: 0.20
    avg_signal: 0.10

llm:
  enabled: true
  provider: openai_compatible
  api_style: responses
  model: gpt-5.4
  base_url: https://api.openai.com/v1
  api_key_env: DAILY_X_SIGNAL_API_KEY
  temperature: 0.2
  max_input_posts: 12
  request_timeout_sec: 120

outputs:
  local:
    enabled: true
    directory: output
  feishu:
    enabled: false
    delivery_type: webhook
    top_n: 10
    webhook_url: null
    bot_webhook_env: DAILY_X_SIGNAL_FEISHU_WEBHOOK
    app_id: null
    app_secret: null
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    receive_id: null
    receive_id_env: DAILY_X_SIGNAL_FEISHU_RECEIVE_ID
    receive_id_type: open_id
    preview_directory: output/feishu-preview
    card_theme: blue
    mention_all: false
  feishu_bitable:
    enabled: false
    app_token: null
    table_id: null
    preview_directory: output/feishu-bitable-preview
    fields:
      post_id: Post ID
      digest_date: Digest Date
      priority: Priority
      priority_score: Priority Score
      original_url: Original URL
      summary: Summary
      published_at: Published At
      topics: Topics

lab:
  enabled: false
  ssh_host: mac-mini
  ssh_timeout_sec: 60
  remote_base: "~/.openclaw/workspace/x-lab"
  auto_run_setup: false
  max_candidates_display: 10
  min_actionable_score: 2
  feishu_poll_timeout_sec: 1800
  feishu_poll_interval_sec: 30
  feishu_doc_token: null
  feishu_report_doc_id: null       # 飞书调研报告文档 ID（x-lab-research 写入完整报告）
  feishu_report_doc_id_env: X_LAB_FEISHU_DOC_ID
  luna_receive_id: null
  luna_receive_id_type: open_id
